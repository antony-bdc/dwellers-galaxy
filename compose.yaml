name: minecraft

services:
  mc:
    image: itzg/minecraft-server:${MC_IMAGE_TAG:-java17}
    container_name: mc
    restart: unless-stopped
    stop_grace_period: 90s          # give the world time to save on shutdown
    tty: true
    stdin_open: true
    ports:
      - "${MC_PORT:-25565}:25565"
    environment:
      EULA: "TRUE"
      TYPE: FORGE
      VERSION: ${MC_VERSION:-1.20.1}
      FORGE_VERSION: ${FORGE_VERSION:-47.3.0}
      MEMORY: ${MC_MEMORY:-6G}
      USE_AIKAR_FLAGS: "true"
      TZ: ${TZ:-Europe/Zurich}
      MOTD: ${MC_MOTD:-A modded homelab server}
      DIFFICULTY: ${MC_DIFFICULTY:-normal}
      MAX_PLAYERS: ${MC_MAX_PLAYERS:-10}
      VIEW_DISTANCE: ${MC_VIEW_DISTANCE:-10}
      SIMULATION_DISTANCE: ${MC_SIMULATION_DISTANCE:-8}
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      WHITELIST: ${MC_WHITELIST:-}
      OPS: ${MC_OPS:-}
      ENABLE_RCON: "true"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      # Mods and configs are mounted read-only and synced into /data on start,
      # so the repo stays the single source of truth for the modpack.
      REMOVE_OLD_MODS: "true"
    secrets:
      - rcon_password
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
      - ./config:/config:ro
    deploy:
      resources:
        limits:
          memory: ${MC_CONTAINER_LIMIT:-8g}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Exposes player count, latency and server health as Prometheus metrics.
  mc-monitor:
    image: itzg/mc-monitor:${MC_MONITOR_TAG:-latest}
    container_name: mc-monitor
    restart: unless-stopped
    command: export-for-prometheus
    environment:
      EXPORT_SERVERS: mc
      EXPORT_PORT: "8080"
    ports:
      - "${MC_METRICS_BIND:-127.0.0.1}:9225:8080"
    depends_on:
      - mc

secrets:
  rcon_password:
    file: ./secrets/rcon_password
